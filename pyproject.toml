[tool.setuptools.packages.find]
include = ["dskit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: slow-running tests"]

[tool.coverage.run]
source = ["dskit"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "if __name__ == .__main__.:",
    "^\\s*\\.\\.\\.$",
]
