[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dskit"
version = "0.0.1"
description = "Venue-agnostic data-science pipeline toolkit — one JSON document declares a process; one command runs it."
requires-python = ">=3.11"
# The tier-1 core is stdlib-only BY DESIGN (enforced in tests/pipeline/test_purity.py):
# a document must stay PLANNABLE on a machine with no heavy dependency installed,
# because planning imports the node classes. Every heavy library is optional and
# imported only inside a node's run(). Install the extras you actually use.
dependencies = []

[project.optional-dependencies]
# Tier-2 library packs (dskit/pipeline/libs/*): each names its library only inside run().
numpy = ["numpy>=1.26"]
sklearn = ["scikit-learn>=1.3", "joblib>=1.3"]
torch = ["torch>=2.0"]
transformers = ["transformers>=4.30", "torch>=2.0"]
optuna = ["optuna>=3.0"]
pyomo = ["pyomo>=6.7", "highspy>=1.7"]
# No pack of its own: LightGBM ships an sklearn-compatible estimator API, so
# "lightgbm.LGBMRegressor" resolves straight through the SklearnFit doorway.
# A wrapper class here would add nothing but a place to drift. xgboost and
# catboost would enter exactly this way. Self-sufficient like transformers
# above (which carries torch): the path runs THROUGH SklearnFit, so the
# extra carries that doorway's scikit-learn/joblib runtime too.
lightgbm = ["lightgbm>=4.0", "scikit-learn>=1.3", "joblib>=1.3"]
# The tracking SINK pack (dskit/pipeline/libs/mlflow.py) — it registers into
# SINK_KINDS, not the node registry, and defaults to a local sqlite store, so
# installing this extra needs no server anywhere.
mlflow = ["mlflow>=2.9"]
# Tier-2 store packs (dskit/assets/libs/*), the localtables connector
# (dskit/onboarding/libs/localtables.py) AND the production RunReference pack
# (dskit/production/libs/parquet.py): one library, one extra; same lazy-import
# rule.
parquet = ["pyarrow>=15"]
# Tier-2 onboarding connector packs; imported only inside connector verbs.
alpaca = ["alpaca-py>=0.44"]
# The Polymarket pack's archive_hours stream reads the pmxt L2 dump off the
# Hugging Face hub (hourly parquet); Gamma/CLOB streams stay stdlib.
polymarket = ["huggingface_hub>=0.20", "pyarrow>=15"]
# The huggingface connector pack acquires one hub repository at a pinned
# commit as a WORM snapshot (ADR-0082); the client is imported inside its
# two network seams only. >=0.23 is the floor because the pack hands the
# hub client token=False for "anonymous" — earlier releases read False as
# a token value rather than as "send nothing".
huggingface = ["huggingface_hub>=0.23"]
# Tier-2 production packs (dskit/production/libs/*), phase 3 of ADR-0090.
# Each is named only inside a method, like every other pack: a serve
# document that declares no `exchange` calendar and no metric sink installs
# none of this and pays for none of it.
exchange-calendars = ["exchange_calendars>=4.5"]
prometheus = ["prometheus-client>=0.20"]
# The SDK carries the meter provider and the readers; the OTLP exporters
# are separate distributions, and a sink with no exporter exports nothing —
# so the extra names both halves rather than the half that imports.
opentelemetry = ["opentelemetry-sdk>=1.20", "opentelemetry-exporter-otlp>=1.20"]
# Everything the library packs can use, for running the full libs test suite.
all = [
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "torch>=2.0",
    "transformers>=4.30",
    "optuna>=3.0",
    "pyomo>=6.7",
    "highspy>=1.7",
    "lightgbm>=4.0",
    "mlflow>=2.9",
    "pyarrow>=15",
    "alpaca-py>=0.44",
    "huggingface_hub>=0.23",
    "exchange_calendars>=4.5",
    "prometheus-client>=0.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
]
dev = [
    "pytest>=7.4",
    "hypothesis>=6.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]

[tool.ruff.lint]
# House baseline: the classic pycodestyle/pyflakes defaults, pinned so
# a ruff upgrade cannot silently widen the rule set. Broader families
# (I, SIM, UP, ...) are deliberate future opt-ins, not defaults.
# D = the docstring standard (CLAUDE.md "Docstrings").
#
# The ANN family is deliberately ABSENT — no parameter annotations AND no
# return annotations. The owner's standing preference is that type hints
# clutter data-science code, and the docstring standard already requires a
# typed `Returns` section, so an enforced `-> dict` would be the SAME type
# stated twice with nothing pinning the two together — the exact defect
# class CLAUDE.md's "Duplication that diverges" exists to stop. Existing
# return annotations are fine; they are simply not required.
select = ["E4", "E7", "E9", "F", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Tests import after pytest.importorskip by design (E402) and bind
# small lambdas where a def would add noise (E731).
"tests/**" = ["E402", "E731", "D"]
# Child tests share the tests/** idiom (ADR-0021).
"children/*/tests/**" = ["E402", "E731", "D"]

# ---------------------------------------------------------------------
# PRE-STANDARD MODULES — the remaining work, in config form.
#
# The docstring standard applies to new code and to any function you
# meaningfully edit; it is NOT a retrofit sweep. Every module written
# before the standard is listed here. **Delete a module's entry when you
# convert it** — that is what makes the list shrink to nothing.
#
# Ignores are file-granular, so clearing a large module (document.py,
# torch.py) means converting the whole file; do that as its own commit.
# driver.py was drained that way — the pattern to copy.
# ---------------------------------------------------------------------
"children/_skeleton/yourproject/connectors.py" = ["D"]
"children/_skeleton/yourproject/nodes.py" = ["D"]
"children/intraday_poc/intraday_poc/__init__.py" = ["D"]
"dskit/__init__.py" = ["D"]
"dskit/assets/__main__.py" = ["D"]
"dskit/assets/base.py" = ["D"]
"dskit/assets/default_model.py" = ["D"]
"dskit/assets/ingest.py" = ["D"]
"dskit/assets/libs/parquet.py" = ["D"]
"dskit/assets/libs/sqlite.py" = ["D"]
"dskit/assets/lineage.py" = ["D"]
"dskit/assets/model.py" = ["D"]
"dskit/assets/record.py" = ["D"]
"dskit/assets/registry.py" = ["D"]
"dskit/assets/store.py" = ["D"]
"dskit/assets/sync.py" = ["D"]
"dskit/onboarding/__init__.py" = ["D"]
"dskit/onboarding/__main__.py" = ["D"]
"dskit/onboarding/acquire.py" = ["D"]
"dskit/onboarding/base.py" = ["D"]
"dskit/onboarding/certify.py" = ["D"]
"dskit/onboarding/codec.py" = ["D"]
"dskit/onboarding/connector.py" = ["D"]
"dskit/onboarding/coverage.py" = ["D"]
"dskit/onboarding/default_model.py" = ["D"]
"dskit/onboarding/layout.py" = ["D"]
"dskit/onboarding/libs/localfiles.py" = ["D"]
"dskit/onboarding/libs/restapi.py" = ["D"]
"dskit/onboarding/observations.py" = ["D"]
"dskit/onboarding/publish.py" = ["D"]
"dskit/onboarding/snapshot.py" = ["D"]
"dskit/onboarding/state.py" = ["D"]
"dskit/onboarding/validate.py" = ["D"]
"dskit/pipeline/base.py" = ["D"]
"dskit/pipeline/conformance.py" = ["D"]
"dskit/pipeline/document.py" = ["D"]
"dskit/pipeline/env.py" = ["D"]
"dskit/pipeline/features.py" = ["D"]
"dskit/pipeline/io.py" = ["D"]
"dskit/pipeline/kinds_search.py" = ["D"]
"dskit/pipeline/kinds_stats.py" = ["D"]
"dskit/pipeline/kinds_table.py" = ["D"]
"dskit/pipeline/libs/matplotlib.py" = ["D"]
"dskit/pipeline/libs/pyomo.py" = ["D"]
"dskit/pipeline/libs/sb3.py" = ["D"]
"dskit/pipeline/libs/sklearn.py" = ["D"]
"dskit/pipeline/libs/transformers.py" = ["D"]
"dskit/pipeline/metrics.py" = ["D"]
"dskit/pipeline/node.py" = ["D"]
"dskit/pipeline/protocols.py" = ["D"]
"dskit/pipeline/registry.py" = ["D"]
"dskit/pipeline/resolve.py" = ["D"]
"dskit/pipeline/runner.py" = ["D"]
"dskit/pipeline/stats.py" = ["D"]
"dskit/pipeline/synthetic_nodes.py" = ["D"]
"dskit/pipeline/testing.py" = ["D"]
"dskit/pipeline/trainlog.py" = ["D"]

[tool.setuptools.packages.find]
include = ["dskit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: slow-running tests"]

[tool.coverage.run]
source = ["dskit"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "if __name__ == .__main__.:",
    "^\\s*\\.\\.\\.$",
]
