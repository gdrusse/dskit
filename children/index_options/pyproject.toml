[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "index-options"
version = "0.0.1"
description = "Synthetic cash-settled index-option diagnostics using dskit."
requires-python = ">=3.11"
dependencies = ["dskit"]

[project.optional-dependencies]
cdf = ["numpy", "pandas", "pyarrow", "scipy", "scikit-learn", "lightgbm", "torch", "exchange-calendars"]

[tool.setuptools.packages.find]
include = ["index_options*"]
