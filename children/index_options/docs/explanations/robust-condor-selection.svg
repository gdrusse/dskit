.bg{fill:var(--surface)} .t{fill:var(--ink);font-size:15px;font-weight:600} .s{fill:var(--ink2);font-size:12.5px}
.l{fill:var(--ink);font-size:13px} .g{stroke:var(--grid);stroke-width:1} .z{fill:var(--zone)} .ax{stroke:var(--ink2);stroke-width:1}
.ln{fill:none;stroke-width:2;stroke-linejoin:round} .A{stroke:var(--a)} .B{stroke:var(--b)} .fA{fill:var(--a)} .fB{fill:var(--b)} .fN{fill:var(--nom)}
.mk{stroke:var(--surface);stroke-width:2}
</style>
