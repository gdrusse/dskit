<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">Robust condor selection, toy example</title>
<desc id="d">Top: robust profit per share versus uncertainty budget for narrow condor A and wide condor B; A is best below 0.50, B between 0.50 and 0.80, no trade above. Bottom: nominal versus worst-case probabilities at budget 0.60 for A and for B.</desc>
