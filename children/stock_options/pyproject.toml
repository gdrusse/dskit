[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-options"
version = "0.0.1"
description = "A thin dskit child for stock-option strategy research."
requires-python = ">=3.11"
dependencies = ["dskit"]

[tool.setuptools.packages.find]
include = ["stock_options*"]
