# A child project's OWN packaging — the child is installable on its own,
# in-repo and after graduation, and dskit is its only coupling.
#
# Copying the skeleton? The rename is a GLOBAL replace, not a file list —
# it must also hit the tests' imports, the kind prefixes, and the configs:
#   cp -r children/_skeleton children/<name> && cd children/<name>
#   grep -rl crypto_trading . | xargs sed -i 's/crypto_trading/<name>/g'
#   mv crypto_trading <name>
# That covers this file's `name` + `include` glob and everything else.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto_trading"                # <- 1. your project's distribution name
version = "0.0.1"
description = "A dskit child: crypto trading research — tier-3 wrappers + JSON configs."
requires-python = ">=3.11"
# `dskit` is the ONLY dependency and the only coupling (ADR-0021) — never a
# path into the dskit repo. Your own heavy libraries (vendor SDKs, torch, …)
# are added here too, but stay imported only inside run()/read().
dependencies = ["dskit"]

[project.optional-dependencies]
# pyarrow is imported only inside dskit's ZipCsvToParquet.transform() and the day-file reader; the
# configs and the rest of the package plan without it.
parquet = ["pyarrow>=15"]
# numpy and pyarrow are imported only inside SpotFeatures.run and the day-file reader (stage B).
features = ["numpy>=1.26", "pyarrow>=15"]

[tool.setuptools.packages.find]
include = ["crypto_trading*"]          # <- 3. matches the renamed package dir
